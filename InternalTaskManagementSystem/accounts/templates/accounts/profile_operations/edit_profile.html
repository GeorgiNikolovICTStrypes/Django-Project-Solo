{% extends 'base.html' %}
{% load static %}
{% block css %} 
    <link rel = "stylesheet" href = "{% static 'accounts/register.css' %}">
{% endblock css %}
{% block title %} Edit Profile {% endblock title %}

{% block body %}
    <h1>Edit Profile</h1>
    <form method="POST">    
        {% csrf_token %}
        {{form}}
    <button type = "submit" class = 'fancy-btn'>Save Changes</button>
    </form>
    <a href="/accounts/password_change/" class = 'redirect_links'>Want to change your password?</a>
{% endblock body %}

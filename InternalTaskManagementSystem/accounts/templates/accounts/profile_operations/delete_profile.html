{% extends 'base.html' %}
{% load static %}
{% block css %} 
    <link rel = "stylesheet" href = "{% static 'accounts/register.css' %}">
{% endblock css %}
{% block title %} Delete Profile {% endblock title %}

{% block body %}
    <h1>Delete Profile</h1>
    <form method="POST">    
    <p>Are you sure you want to delete your profile, {{user.username}}? </p>
    <button type = "submit" class = 'fancy-btn'>Delete Account</button>
    </form>
    <a href="{% url 'dashboard' %}" class = 'redirect_links'>Cancel</a>
{% endblock body %}

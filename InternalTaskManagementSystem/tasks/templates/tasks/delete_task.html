{% extends 'base.html' %}
{% load static %}
{% block css %} 
{% endblock css %}
{% block title %} Delete Task {% endblock title %}

{% block body %}
    <h1>Are you sure you want to delete this task: {{task.title}}</h1>
    <form method="POST">    
        {% csrf_token %}
        {{form}}
    <button type = "submit" class = 'fancy-btn'>DELETE TASK</button>
    </form>
    <a href = '{% url "view_task" task.id %}' class = 'redirect_links'>Cancel</a>
{% endblock body %}
